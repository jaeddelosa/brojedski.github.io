<body>
  <div id="root"></div>
  <script type="module">
import * as React from "https://esm.sh/react@18.3.1";
import * as ReactDOM from "https://esm.sh/react-dom@18.3.1/client";

const e = React.createElement;

function Link({href, label, muted, hover, isDark}) {
  const [hov, setHov] = React.useState(false);
  return e("div", null,
    e("a", {
      href,
      target: href.startsWith("mailto:") ? undefined : "_blank",
      rel: href.startsWith("mailto:") ? undefined : "noopener noreferrer",
      className: "link-label",
      onMouseEnter: () => setHov(true),
      onMouseLeave: () => setHov(false),
      style: {
        fontSize:"15px", lineHeight:1.5,
        color: hov? hover : muted,
        textDecoration: hov? "underline":"none",
        textUnderlineOffset:"4px",
        textDecorationColor: isDark ? "#3A3A3A":"#BBBBBB",
        textDecorationThickness:"1px",
        wordBreak:"break-word"
      }
    }, label)
  );
}

function Section({label, border, fg, muted, children}){
  return e("section", {style:{borderTop:`1px solid ${border}`, padding:"28px 0"}},
    e("h2", {style:{fontSize:"13px", fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", color:muted, margin:"0 0 16px 0"}}, label),
    e("div", {style:{display:"flex", flexDirection:"column", gap:"10px"}}, children)
  );
}

function stripHtml(html){
  if(!html) return "";
  return html.replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();
}

function App(){
  const [isDark, setIsDark] = React.useState(true);
  const [posts, setPosts] = React.useState([]);
  const [status, setStatus] = React.useState("loading");

  React.useEffect(()=>{
    (async()=>{
      try{
        setStatus("loading");
        const rss = encodeURIComponent("https://blog.jaeddelosa.com/rss.xml");
        const data = await (await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rss}`)).json();
        if(data?.items?.length){
          setPosts(data.items.slice(0,6));
          setStatus("ok");
        } else setStatus("error");
      }catch{ setStatus("error"); }
    })();
  },[]);

  const bg = isDark ? "#0F0F0F" : "#FFFFFF";
  const fg = isDark ? "#E8E8E8" : "#111111";
  const muted = isDark ? "#A3A3A3" : "#6B6B6B";
  const border = isDark ? "#222222" : "#E8E8E8";
  const hoverBg = isDark ? "#1A1A1A" : "#F5F5F5";
  const hoverFg = isDark ? "#FFFFFF" : "#111111";

  return e("div", {style:{backgroundColor:bg, color:fg, minHeight:"100vh", fontFamily:'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif', WebkitFontSmoothing:"antialiased", MozOsxFontSmoothing:"grayscale", transition:"background-color 0.2s, color 0.2s"}},
    e("div", {style:{maxWidth:"640px", margin:"0 auto", padding:"0 24px 80px"}},
      e("div", {style:{display:"flex", justifyContent:"flex-end", padding:"24px 0 12px", minHeight:"56px"}},
        e("button", {"aria-label": isDark? "Switch to light mode":"Switch to dark mode", onClick:()=>setIsDark(v=>!v), style:{width:"36px", height:"36px", display:"grid", placeItems:"center", borderRadius:"999px", border:`1px solid ${border}`, background:"transparent", color:fg, cursor:"pointer"}},
          isDark
            ? e("svg", {width:"16", height:"16", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:"1.5", strokeLinecap:"round", strokeLinejoin:"round"},
                e("circle", {cx:"12", cy:"12", r:"4"}),
                e("path", {d:"M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"})
              )
            : e("svg", {width:"16", height:"16", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:"1.5", strokeLinecap:"round", strokeLinejoin:"round"},
                e("path", {d:"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"})
              )
        )
      ),
      e("header", {style:{paddingBottom:"32px"}},
        e("h1", {style:{fontSize:"28px", fontWeight:600, letterSpacing:"-0.02em", lineHeight:1.1, margin:0}}, "Jaed Delosa"),
        e("p", {style:{marginTop:"18px", fontSize:"16px", lineHeight:1.65, color:muted, maxWidth:"520px"}}, "Hi, I'm Jaed. This is my home page on the internet. Below is a short index of places where you can read my work, reach me, or collaborate with me.")
      ),
      e("div", {style:{display:"flex", flexDirection:"column"}},
        e(Section, {label:"Contact", border, fg, muted},
          e(Link, {href:"mailto:info@jaeddelosa.com", label:"Email — info@jaeddelosa.com", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://api.whatsapp.com/send/?phone=639810848049&text&type=phone_number&app_absent=0", label:"WhatsApp", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://jaed.fyi/messaging", label:"Signal", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://tally.so/r/mOMAqa", label:"Contact form", muted, hover:hoverFg, isDark})
        ),
        e(Section, {label:"Work with me", border, fg, muted},
          e(Link, {href:"https://workwithme.jaeddelosa.com/", label:"Web and AI Integration Solutions", muted, hover:hoverFg, isDark}),
          e(Link, {href:"http://lightfoot.jaed.fyi/", label:"Lightfoot Research", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://mystore.jaeddelosa.com", label:"Digital store", muted, hover:hoverFg, isDark})
        ),
        e(Section, {label:"Writing", border, fg, muted},
          e(Link, {href:"https://blog.jaeddelosa.com", label:"Personal blog", muted, hover:hoverFg, isDark})
        ),
        e("section", {style:{borderTop:`1px solid ${border}`, padding:"28px 0"}},
          e("div", {style:{display:"flex", alignItems:"center", justifyContent:"space-between", gap:"12px", flexWrap:"wrap", marginBottom:"18px"}},
            e("h2", {style:{fontSize:"13px", fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", color:muted, margin:0}}, "Latest from the blog"),
            e("a", {href:"https://blog.jaeddelosa.com/rss.xml", target:"_blank", rel:"noopener noreferrer", style:{fontSize:"12px", fontWeight:500, letterSpacing:"0.02em", padding:"6px 12px", borderRadius:"999px", border:`1px solid ${border}`, color:fg, textDecoration:"none", background: isDark ? "#151515":"#FAFAFA"}}, "Subscribe via RSS →")
          ),
          e("div", {style:{display:"flex", flexDirection:"column", gap:"2px"}},
            status==="loading" && [0,1,2].map(i => e("div", {key:i, style:{padding:"16px 12px", borderRadius:"8px", opacity:0.5}},
              e("div", {style:{height:"14px", width:"70%", background:border, borderRadius:"4px", marginBottom:"10px"}}),
              e("div", {style:{height:"10px", width:"40%", background:border, borderRadius:"4px"}})
            )),
            status==="error" && e("p", {style:{fontSize:"14px", color:muted, padding:"8px 0"}}, "Unable to load posts right now. Visit the blog directly."),
            posts.map((p, idx)=>{
              const d = p.pubDate ? new Date(p.pubDate) : null;
              const desc = stripHtml(p.description).slice(0,140);
              return e("a", {key:idx, href:p.link, target:"_blank", rel:"noopener noreferrer", style:{display:"block", textDecoration:"none", padding:"14px 12px", margin:"0 -12px", borderRadius:"8px", transition:"background-color 0.15s"}, onMouseEnter:(ev)=>ev.currentTarget.style.backgroundColor=hoverBg, onMouseLeave:(ev)=>ev.currentTarget.style.backgroundColor="transparent"},
                e("div", {style:{fontSize:"15px", fontWeight:500, lineHeight:1.4, color:fg}}, p.title),
                e("div", {style:{display:"flex", gap:"10px", alignItems:"baseline", marginTop:"6px", flexWrap:"wrap"}},
                  d && e("span", {style:{fontSize:"12px", color:muted, whiteSpace:"nowrap"}}, d.toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"})),
                  e("span", {style:{fontSize:"13px", color:muted, lineHeight:1.5}}, desc + (desc.length>=140 ? "…":""))
                )
              )
            })
          )
        ),
        e(Section, {label:"Elsewhere", border, fg, muted},
          e(Link, {href:"https://mastodon.social/@sierra_sam", label:"Mastodon", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://www.linkedin.com/in/jaeddelosa/", label:"LinkedIn", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://www.klook.com/invite/XLMJBT/?_currency=PHP", label:"Travel discounts (Klook)", muted, hover:hoverFg, isDark})
        ),
        e("footer", {style:{borderTop:`1px solid ${border}`, paddingTop:"24px", marginTop:"4px"}},
          e("p", {style:{fontSize:"13px", lineHeight:1.6, color:muted, margin:0}}, "For business partnerships, reach out by email or WhatsApp. I usually reply within a business day."),
          e("p", {style:{fontSize:"12px", lineHeight:1.5, color: isDark ? "#5A5A5A":"#9A9A9A", marginTop:"28px"}}, `© ${new Date().getFullYear()} Jaed Delosa`)
        )
      )
    ),
    e("style", null, `
        a.link-label {
          transition: color 0.15s, text-decoration-color 0.15s;
        }
      `)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(React.StrictMode, null, e(App)));
  </script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
</body>
