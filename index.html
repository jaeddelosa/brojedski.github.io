<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jaed Delosa</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
    #root,body,html{min-height:100%} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
    @keyframes pulse-ring{0%{transform:scale(0.8);opacity:0.6}100%{transform:scale(1.7);opacity:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  </style>

<body>
  <div id="root"></div>
  <script type="module">
import * as React from "https://esm.sh/react@18.3.1";
import * as ReactDOM from "https://esm.sh/react-dom@18.3.1/client";

const e = React.createElement;
const WORKER_URL = "https://test-ai.jaedd.workers.dev/";
const SITE_KEY = "0x4AAAAAAEX_hkkt3xetFg3n";

function Link({href, label, muted, hover, isDark}) {
  const [hov, setHov] = React.useState(false);
  return e("div", null,
    e("a", {
      href, target: href.startsWith("mailto:") ? undefined : "_blank",
      rel: href.startsWith("mailto:") ? undefined : "noopener noreferrer",
      onMouseEnter: () => setHov(true), onMouseLeave: () => setHov(false),
      style: { fontSize:"15px", lineHeight:1.5, color: hov? hover : muted, textDecoration: hov? "underline":"none", textUnderlineOffset:"4px", textDecorationColor: isDark ? "#3A3A3A":"#BBBBBB", textDecorationThickness:"1px", wordBreak:"break-word" }
    }, label)
  );
}
function Section({label, border, fg, muted, children}){
  return e("section", {style:{borderTop:`1px solid ${border}`, padding:"28px 0"}},
    e("h2", {style:{fontSize:"13px", fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", color:muted, margin:"0 0 16px 0"}}, label),
    e("div", {style:{display:"flex", flexDirection:"column", gap:"10px"}}, children)
  );
}
function stripHtml(html){ if(!html) return ""; return html.replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim(); }

// --- FIXED CHATBOT: VISIBLE + FITS + TOKEN WORKS ---
function ChatWidget({isDark}){
  const [open, setOpen] = React.useState(false);
  const [messages, setMessages] = React.useState([{role:"bot", text:"Hey! I'm Jaed AI, a dumb AI bot created by Jaed the hooman being. Ask me about Jaed — he's into big things and open to projects!"}]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const listRef = React.useRef(null);
  const turnstileDivRef = React.useRef(null);
  const widgetIdRef = React.useRef(null);
  const tokenRef = React.useRef(null);
  const pendingResolveRef = React.useRef(null);

  React.useEffect(()=>{ if(listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [messages]);

  React.useEffect(()=>{
    const renderWidget = () => {
      if(!window.turnstile || !turnstileDivRef.current || widgetIdRef.current!==null) return;
      try{
        const id = window.turnstile.render(turnstileDivRef.current, {
          sitekey: SITE_KEY, size:"invisible", action:"chat", theme:isDark?"dark":"light",
          callback: (token)=>{ tokenRef.current=token; if(pendingResolveRef.current){ pendingResolveRef.current(token); pendingResolveRef.current=null; } },
          "expired-callback": ()=>{ tokenRef.current=null; },
          "error-callback": ()=>{ tokenRef.current=null; if(pendingResolveRef.current){ pendingResolveRef.current(""); pendingResolveRef.current=null; } }
        });
        widgetIdRef.current=id;
      }catch{}
    };
    if(window.turnstile) renderWidget();
    const interval=setInterval(()=>{ if(window.turnstile && widgetIdRef.current===null) renderWidget(); if(widgetIdRef.current!==null) clearInterval(interval); },500);
    return ()=>clearInterval(interval);
  }, [isDark, open]);

  const getToken = async () => {
    if(tokenRef.current) return tokenRef.current;
    if(!window.turnstile || widgetIdRef.current===null) return "";
    return new Promise((resolve)=>{
      pendingResolveRef.current=resolve;
      try{ window.turnstile.execute(widgetIdRef.current); }catch{ resolve(tokenRef.current||""); pendingResolveRef.current=null; }
      setTimeout(()=>{ if(pendingResolveRef.current){ pendingResolveRef.current(tokenRef.current||""); pendingResolveRef.current=null; } }, 9000);
    });
  };

  const send = async () => {
    const msg=input.trim(); if(!msg||loading) return;
    setInput(""); setMessages(m=>[...m,{role:"user",text:msg}]); setLoading(true);
    try{
      const token=await getToken();
      if(!token) throw new Error("Turnstile not ready — add jaeddelosa.com to Turnstile domains");
      const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,"cf-turnstile-response":token})});
      const data=await res.json();
      if(!res.ok) throw new Error(data.reply||`Error ${res.status}`);
      setMessages(m=>[...m,{role:"bot",text:data.reply}]);
      try{ if(window.turnstile&&widgetIdRef.current!==null){ window.turnstile.reset(widgetIdRef.current); tokenRef.current=null; } }catch{}
    }catch(err){ setMessages(m=>[...m,{role:"bot",text:"⚠️ "+err.message}]); }
    setLoading(false);
  };

  const bg=isDark?"#0A0A0A":"#FFF"; const fg=isDark?"#F5F5F5":"#111"; const muted=isDark?"#9A9A9A":"#666"; const border=isDark?"#2A2A2A":"#E0E0E0"; const cardBg=isDark?"#141414":"#FFF";

  return e(React.Fragment, null,
    e("div", {ref:turnstileDivRef, style:{position:"fixed", bottom:0, left:0, width:"1px", height:"1px", opacity:0, pointerEvents:"none"}}),
    e("div", {style:{position:"fixed", bottom:"20px", right:"20px", zIndex:9999, display:"flex", alignItems:"center", gap:"10px"}},
      !open && e("div", {style:{background:isDark?"#fff":"#111", color:isDark?"#111":"#fff", padding:"9px 14px", borderRadius:"20px", fontSize:"13px", fontWeight:600, boxShadow:"0 6px 20px rgba(0,0,0,.25)", animation:"float 3s ease-in-out infinite", cursor:"pointer", whiteSpace:"nowrap"}, onClick:()=>setOpen(true)}, "💬 Chat with Jaed AI"),
      e("div", {style:{position:"relative", width:"60px", height:"60px"}},
        !open && e("div", {style:{position:"absolute", inset:0, borderRadius:"50%", background:isDark?"#fff":"#111", animation:"pulse-ring 2s infinite"}}),
        e("button", {onClick:()=>setOpen(o=>!o), style:{position:"relative", width:"60px", height:"60px", borderRadius:"50%", background:isDark?"#FFF":"#111", color:isDark?"#111":"#FFF", border:`2px solid ${isDark?"#fff":"#111"}`, cursor:"pointer", display:"grid", placeItems:"center", boxShadow:"0 10px 30px rgba(0,0,0,.35)"}},
          open ? e("span", {style:{fontSize:"22px"}}, "×") : e("svg", {width:"26", height:"26", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:"2"}, e("path", {d:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"}))
        )
      )
    ),
    open && e("div", {style:{
      position:"fixed", bottom:"92px", right:"16px",
      width:"min(400px, calc(100vw - 20px))",
      height:"min(560px, calc(100dvh - 110px))",
      maxHeight:"calc(100dvh - 110px)",
      background:cardBg, border:`1px solid ${border}`, borderRadius:"20px",
      boxShadow:"0 24px 60px rgba(0,0,0,.45)", zIndex:9999, display:"flex", flexDirection:"column", overflow:"hidden"
    }},
      e("div", {style:{padding:"14px 16px", borderBottom:`1px solid ${border}`, display:"flex", alignItems:"center", justifyContent:"space-between", background:isDark?"#1C1C1C":"#F7F7F7", flexShrink:0}},
        e("div", {style:{display:"flex", alignItems:"center", gap:"10px"}},
          e("div", {style:{width:"32px", height:"32px", borderRadius:"50%", background:isDark?"#FFF":"#000", color:isDark?"#000":"#FFF", display:"grid", placeItems:"center", fontWeight:800, fontSize:"14px"}}, "J"),
          e("div", null,
            e("div", {style:{fontSize:"14px", fontWeight:700, color:fg}}, "Jaed AI"),
            e("div", {style:{display:"flex", alignItems:"center", gap:"5px", marginTop:"2px"}}, e("div", {style:{width:"7px", height:"7px", borderRadius:"50%", background:"#22c55e"}}), e("div", {style:{fontSize:"11px", color:muted}}, "Online"))
          )
        ),
        e("button", {onClick:()=>setOpen(false), style:{width:"28px", height:"28px", borderRadius:"50%", border:`1px solid ${border}`, background:"transparent", color:muted, cursor:"pointer", display:"grid", placeItems:"center"}}, "×")
      ),
      e("div", {ref:listRef, style:{flex:1, overflowY:"auto", padding:"16px", display:"flex", flexDirection:"column", gap:"12px", background:bg}},
        messages.map((m,i)=> e("div", {key:i, style:{alignSelf:m.role==="user"?"flex-end":"flex-start", maxWidth:"82%", padding:"11px 15px", borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px", background:m.role==="user"?(isDark?"#FFF":"#000"):(isDark?"#242424":"#EFEFEF"), color:m.role==="user"?(isDark?"#000":"#FFF"):fg, fontSize:"14.5px", lineHeight:1.6, whiteSpace:"pre-wrap", wordBreak:"break-word", border:m.role==="bot"?`1px solid ${border}`:"none"}}, m.text)),
        loading && e("div", {style:{alignSelf:"flex-start", padding:"11px 15px", borderRadius:"16px", background:isDark?"#242424":"#EFEFEF", border:`1px solid ${border}`, color:muted, fontSize:"13px"}}, "Typing…")
      ),
      e("div", {style:{padding:"12px", borderTop:`1px solid ${border}`, display:"flex", gap:"10px", background:cardBg, alignItems:"center", flexShrink:0}},
        e("input", {value:input, onChange:e=>setInput(e.target.value), onKeyDown:e=>{ if(e.key==="Enter") send(); }, placeholder:"Ask Jaed anything...", style:{flex:1, border:`1px solid ${border}`, background:isDark?"#1F1F1F":"#F5F5F5", color:fg, borderRadius:"24px", padding:"11px 16px", fontSize:"14.5px", outline:"none"}}),
        e("button", {onClick:send, disabled:loading||!input.trim(), style:{width:"42px", height:"42px", borderRadius:"50%", border:"none", background:isDark?"#FFF":"#000", color:isDark?"#000":"#FFF", cursor:"pointer", display:"grid", placeItems:"center", opacity:loading||!input.trim()?0.5:1, flexShrink:0}}, "↑")
      )
    )
  );
}

function App(){
  const [isDark, setIsDark] = React.useState(true);
  const [posts, setPosts] = React.useState([]);
  const [status, setStatus] = React.useState("loading");

  React.useEffect(()=>{
    (async()=>{
      try{
        setStatus("loading");
        const rss = encodeURIComponent("https://blog.jaeddelosa.com/rss.xml");
        const data = await (await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rss}`)).json();
        if(data?.items?.length){ setPosts(data.items.slice(0,6)); setStatus("ok"); } else setStatus("error");
      }catch{ setStatus("error"); }
    })();
  },[]);

  const bg = isDark ? "#0F0F0F" : "#FFFFFF";
  const fg = isDark ? "#E8E8E8" : "#111111";
  const muted = isDark ? "#A3A3A3" : "#6B6B6B";
  const border = isDark ? "#222222" : "#E8E8E8";
  const hoverBg = isDark ? "#1A1A1A" : "#F5F5F5";
  const hoverFg = isDark ? "#FFFFFF" : "#111111";

  return e("div", {style:{backgroundColor:bg, color:fg, minHeight:"100vh", fontFamily:'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif', WebkitFontSmoothing:"antialiased", MozOsxFontSmoothing:"grayscale", transition:"background-color 0.2s, color 0.2s"}},
    e("div", {style:{maxWidth:"640px", margin:"0 auto", padding:"0 24px 80px"}},
      e("div", {style:{display:"flex", justifyContent:"flex-end", padding:"24px 0 12px", minHeight:"56px"}},
        e("button", {"aria-label": isDark? "Switch to light mode":"Switch to dark mode", onClick:()=>setIsDark(v=>!v), style:{width:"36px", height:"36px", display:"grid", placeItems:"center", borderRadius:"999px", border:`1px solid ${border}`, background:"transparent", color:fg, cursor:"pointer"}}, isDark ? e("svg", {width:"16", height:"16", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:"1.5"}, e("circle", {cx:"12", cy:"12", r:"4"}), e("path", {d:"M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"})) : e("svg", {width:"16", height:"16", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:"1.5"}, e("path", {d:"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"}))
        )
      ),
      e("header", {style:{paddingBottom:"32px"}},
        e("h1", {style:{fontSize:"28px", fontWeight:600, letterSpacing:"-0.02em", lineHeight:1.1, margin:0}}, "Jaed Delosa"),
        e("p", {style:{marginTop:"18px", fontSize:"16px", lineHeight:1.65, color:muted, maxWidth:"520px"}}, "Hi, I'm Jaed. This is my home page on the internet. Below is a short index of places where you can read my work, reach me, or collaborate with me.")
      ),
      e("div", {style:{display:"flex", flexDirection:"column"}},
        e(Section, {label:"Contact", border, fg, muted},
          e(Link, {href:"mailto:info@jaeddelosa.com", label:"Email — info@jaeddelosa.com", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://api.whatsapp.com/send/?phone=639810848049&text&type=phone_number&app_absent=0", label:"WhatsApp", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://jaed.fyi/messaging", label:"Signal", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://tally.so/r/mOMAqa", label:"Contact form", muted, hover:hoverFg, isDark})
        ),
        e(Section, {label:"Work with me", border, fg, muted},
          e(Link, {href:"https://workwithme.jaeddelosa.com/", label:"Web and AI Integration Solutions", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://lightfoot.research.jaeddelosa.com/", label:"Lightfoot Research", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://mystore.jaeddelosa.com", label:"Digital store", muted, hover:hoverFg, isDark})
        ),
        e(Section, {label:"Writing", border, fg, muted},
          e(Link, {href:"https://blog.jaeddelosa.com", label:"Personal blog", muted, hover:hoverFg, isDark})
        ),
        e("section", {style:{borderTop:`1px solid ${border}`, padding:"28px 0"}},
          e("div", {style:{display:"flex", alignItems:"center", justifyContent:"space-between", gap:"12px", flexWrap:"wrap", marginBottom:"18px"}},
            e("h2", {style:{fontSize:"13px", fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", color:muted, margin:0}}, "Latest from the blog"),
            e("a", {href:"https://blog.jaeddelosa.com/rss.xml", target:"_blank", rel:"noopener noreferrer", style:{fontSize:"12px", fontWeight:500, letterSpacing:"0.02em", padding:"6px 12px", borderRadius:"999px", border:`1px solid ${border}`, color:fg, textDecoration:"none", background: isDark ? "#151515":"#FAFAFA"}}, "Subscribe via RSS →")
          ),
          e("div", {style:{display:"flex", flexDirection:"column", gap:"2px"}},
            status==="loading" && [0,1,2].map(i => e("div", {key:i, style:{padding:"16px 12px", borderRadius:"8px", opacity:0.5}}, e("div", {style:{height:"14px", width:"70%", background:border, borderRadius:"4px", marginBottom:"10px"}}), e("div", {style:{height:"10px", width:"40%", background:border, borderRadius:"4px"}}))),
            status==="error" && e("p", {style:{fontSize:"14px", color:muted, padding:"8px 0"}}, "Unable to load posts right now. Visit the blog directly."),
            posts.map((p, idx)=>{
              const d = p.pubDate ? new Date(p.pubDate) : null;
              const desc = stripHtml(p.description).slice(0,140);
              return e("a", {key:idx, href:p.link, target:"_blank", rel:"noopener noreferrer", style:{display:"block", textDecoration:"none", padding:"14px 12px", margin:"0 -12px", borderRadius:"8px", transition:"background-color 0.15s"}, onMouseEnter:(ev)=>ev.currentTarget.style.backgroundColor=hoverBg, onMouseLeave:(ev)=>ev.currentTarget.style.backgroundColor="transparent"},
                e("div", {style:{fontSize:"15px", fontWeight:500, lineHeight:1.4, color:fg}}, p.title),
                e("div", {style:{display:"flex", gap:"10px", alignItems:"baseline", marginTop:"6px", flexWrap:"wrap"}}, d && e("span", {style:{fontSize:"12px", color:muted, whiteSpace:"nowrap"}}, d.toLocaleDateString("en-US", {year:"numeric", month:"short", day:"numeric"})), e("span", {style:{fontSize:"13px", color:muted, lineHeight:1.5}}, desc + (desc.length>=140 ? "…":"")))
              )
            })
          )
        ),
        e(Section, {label:"Elsewhere", border, fg, muted},
          e(Link, {href:"https://mastodon.social/@sierra_sam", label:"Mastodon", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://www.linkedin.com/in/jaeddelosa/", label:"LinkedIn", muted, hover:hoverFg, isDark}),
          e(Link, {href:"https://www.klook.com/invite/XLMJBT/?_currency=PHP", label:"Travel discounts (Klook)", muted, hover:hoverFg, isDark})
        ),
        e("footer", {style:{borderTop:`1px solid ${border}`, paddingTop:"24px", marginTop:"4px"}},
          e("p", {style:{fontSize:"13px", lineHeight:1.6, color:muted, margin:0}}, "For business partnerships, reach out by email or WhatsApp. I usually reply within a business day."),
          e("p", {style:{fontSize:"12px", lineHeight:1.5, color: isDark ? "#5A5A5A":"#9A9A9A", marginTop:"28px"}}, `© ${new Date().getFullYear()} Jaed Delosa`)
        )
      )
    ),
    e(ChatWidget, {isDark}),
    e("style", null, `a.link-label{transition:color 0.15s, text-decoration-color 0.15s}`)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(React.StrictMode, null, e(App)));
  </script>
</body>
